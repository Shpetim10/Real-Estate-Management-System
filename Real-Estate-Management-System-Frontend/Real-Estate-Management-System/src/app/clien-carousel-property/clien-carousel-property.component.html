<div id="propertyCarousel" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div *ngFor="let group of propertiesGroups; let i = index" [ngClass]="{'carousel-item': true, 'active': i === 0}">
      <div class="row">
        <div *ngFor="let property of group" class="col-md-4">
          <div class="property-item">
            <a [href]="property.imageUrl" class="img">
              <img [src]="property.imageUrl" class="img-fluid" [alt]="'Property ' + property.propertyId">
            </a>
            <div class="property-content">
              <div class="price mb-2"><span>$ {{property.price}}</span></div>
              <span class="d-block mb-2 text-black-50">{{property.address}}</span>
              <span class="city d-block mb-3">{{property.city}}</span>
              <div class="specs d-flex mb-4">
                <span class="d-flex align-items-center me-3">
                  <span class="icon-bed me-2"></span><span class="caption">{{property.bedrooms}} beds</span>
                </span>
                <span class="d-flex align-items-center">
                  <span class="icon-bath me-2"></span><span class="caption">{{property.bathrooms}} baths</span>
                </span>
              </div>
              <a class="btn btn-primary py-2 px-3" (click)="openViewPage(property)">See details</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Carousel Controls -->
  <button class="carousel-control-prev" type="button" data-bs-target="#propertyCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#propertyCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>

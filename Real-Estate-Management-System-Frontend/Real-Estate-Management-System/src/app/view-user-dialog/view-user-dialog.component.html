<header>
  <div class="card-header d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0" style="color: #e791c6;">
      <i class="bi bi-person-circle me-2"></i> User Details
    </h1>
  </div>
</header>

<mat-dialog-content class="dialog-content" style="background-color: #343a40; color: #f8f9fa; border-radius: 0.5rem;">
  <div class="container py-3">
    <div class="row mb-3">
      <div class="col-md-6">
        <strong style="color: #e791c6;"><i class="bi bi-person"></i> First Name:</strong>
        <p style="color: var(--bs-light);">{{ data.user.name }}</p>
      </div>
      <div class="col-md-6">
        <strong style="color: #e791c6;"><i class="bi bi-person"></i> Last Name:</strong>
        <p style="color: var(--bs-light);">{{ data.user.surname }}</p>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <strong style="color: #e791c6;"><i class="bi bi-envelope"></i> Email:</strong>
        <p style="color: var(--bs-light);">{{ data.user.email }}</p>
      </div>
      <div class="col-md-6">
        <strong style="color: #e791c6;"><i class="bi bi-phone"></i> Phone:</strong>
        <p style="color: var(--bs-light);">{{ data.user.phone }}</p>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <strong style="color: #e791c6;"><i class="bi bi-person-badge"></i> Username:</strong>
        <p style="color: var(--bs-light);">{{ data.user.username }}</p>
      </div>
      <div class="col-md-6">
        <strong style="color: #e791c6;"><i class="bi bi-shield-lock"></i> Role(s):</strong>
        <p style="color: var(--bs-light);">{{ data.user.roles.join(', ') }}</p>
      </div>
    </div>

    <div class="row mb-3 text-center">
      <div class="col-md-12">
        <strong style="color: #e791c6;"><i class="bi bi-image"></i> Profile Photo:</strong><br>
        <img [src]="data.user.imageUrl" alt="User Photo" class="img-fluid rounded mt-2 border"
             style="max-height: 150px; box-shadow: 0px 0px 10px 3px #23272b;">
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions class="dialog-footer justify-content-end" style="background-color: #23272b;">
  <button mat-button class="btn btn-secondary" style="background-color: #23272b; color: #e791c6;" (click)="onClose()">Close</button>
</mat-dialog-actions>
